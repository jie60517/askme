<!--
  分頁圖示 = 側邊欄與登入頁的品牌圖示(lucide 的 speech)。
  兩邊要是同一個東西 —— 分頁列上長得不一樣的話,使用者會以為開錯站。

  顏色用 currentColor + color-scheme 兩段:淺色底畫深色、深色底畫淺色。
  svg 檔案吃不到專案的 CSS 變數(它是獨立文件),所以這裡是唯一容許寫死色碼的地方。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
     color="#262626">
  <style>
    @media (prefers-color-scheme: dark) { svg { color: #ebebeb } }
  </style>
  <path d="M8.8 20v-4.1l1.9.2a2.3 2.3 0 0 0 2.164-2.1V8.3A5.37 5.37 0 0 0 2 8.25c0 2.8.656 3.054 1 4.55a5.77 5.77 0 0 1 .029 2.758L2 20"/>
  <path d="M19.8 17.8a7.5 7.5 0 0 0 .003-10.603"/>
  <path d="M17 15a3.5 3.5 0 0 0-.025-4.975"/>
</svg>
